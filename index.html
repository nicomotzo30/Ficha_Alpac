<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fichada — Alpac</title>
  <style>
    :root {
      --azul:      #1A2B4A;
      --azul-mid:  #243558;
      --acento:    #E8A020;
      --acento-soft: #F5C96A;
      --fondo:     #F2F4F7;
      --blanco:    #FFFFFF;
      --texto:     #1A2B4A;
      --texto-2:   #5A6A82;
      --verde:     #2A9D5C;
      --rojo:      #C0392B;
      --naranja:   #E06C1A;
      --borde:     #D4DAE6;
      --radio:     14px;
      --radio-sm:  8px;
      --sombra:    0 4px 20px rgba(26,43,74,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--azul);
      padding: 18px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--acento);
      letter-spacing: -0.5px;
    }
    header .logo span { color: var(--blanco); }
    header .reloj {
      margin-left: auto;
      text-align: right;
    }
    header .reloj .hora {
      font-size: 20px;
      font-weight: 700;
      color: var(--blanco);
      font-variant-numeric: tabular-nums;
    }
    header .reloj .fecha {
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-transform: capitalize;
    }
    header .reloj .pendientes {
      font-size: 10px;
      color: var(--acento-soft);
      margin-top: 2px;
      min-height: 12px;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: 20px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── SCREENS ── */
    .screen { display: none; flex-direction: column; gap: 16px; }
    .screen.active { display: flex; }

    /* ── WIFI BANNER ── */
    #wifi-error {
      display: none;
      background: #FEF3CD;
      border: 1px solid #F5C96A;
      border-radius: var(--radio-sm);
      padding: 14px 16px;
      font-size: 13px;
      color: #7A4F00;
      line-height: 1.5;
      text-align: center;
    }
    #wifi-error.visible { display: block; }

    /* ── CARD ── */
    .card {
      background: var(--blanco);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      padding: 20px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--texto-2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    /* ── BÚSQUEDA Y LISTA ── */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border: 1.5px solid var(--borde);
      border-radius: var(--radio-sm);
      font-size: 15px;
      background: var(--fondo);
      color: var(--texto);
      outline: none;
      transition: border-color .15s;
    }
    .search-wrap input:focus { border-color: var(--azul); }
    .search-wrap .icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--texto-2);
      font-size: 16px;
    }

    .empleado-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 340px;
      overflow-y: auto;
    }
    .empleado-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1.5px solid var(--borde);
      border-radius: var(--radio-sm);
      background: var(--blanco);
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
      -webkit-appearance: none;
      width: 100%;
    }
    .empleado-btn:active { background: #EFF2F8; border-color: var(--azul); }
    .empleado-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--azul);
      color: var(--acento);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .empleado-nombre {
      font-size: 15px;
      font-weight: 500;
      color: var(--texto);
    }
    .empleado-arrow {
      margin-left: auto;
      color: var(--borde);
      font-size: 18px;
    }

    /* ── PANTALLA PIN / TIPO (nombre seleccionado) ── */
    .selected-name {
      background: var(--azul);
      border-radius: var(--radio);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .selected-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--acento);
      color: var(--azul);
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .selected-info .nombre {
      font-size: 16px;
      font-weight: 700;
      color: var(--blanco);
    }
    .selected-info .instruccion {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      margin-top: 2px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 8px 0 4px;
    }
    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--borde);
      background: transparent;
      transition: background .1s, border-color .1s;
    }
    .dot.filled { background: var(--azul); border-color: var(--azul); }
    .dot.error  { background: var(--rojo); border-color: var(--rojo); }

    .pin-error {
      text-align: center;
      font-size: 13px;
      color: var(--rojo);
      min-height: 18px;
      font-weight: 500;
    }

    /* ── TECLADO NUMÉRICO ── */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 4px;
    }
    .num-btn {
      background: var(--blanco);
      border: 1.5px solid var(--borde);
      border-radius: var(--radio-sm);
      padding: 16px 10px;
      font-size: 22px;
      font-weight: 600;
      color: var(--texto);
      cursor: pointer;
      transition: background .1s, border-color .1s;
      -webkit-appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .num-btn .sub {
      font-size: 9px;
      font-weight: 400;
      color: var(--texto-2);
      letter-spacing: 0.05em;
    }
    .num-btn:active { background: #EFF2F8; border-color: var(--azul); }
    .num-btn.clear { font-size: 15px; color: var(--texto-2); }
    .num-btn.borrar { font-size: 20px; color: var(--rojo); }
    .num-btn.empty { border: none; background: transparent; pointer-events: none; }

    /* ── BOTONES INGRESO / EGRESO ── */
    .tipo-botones {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }
    .tipo-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 30px 20px;
      border: none;
      border-radius: var(--radio);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      -webkit-appearance: none;
      color: var(--blanco);
      box-shadow: var(--sombra);
    }
    .tipo-btn:active { transform: scale(0.98); }
    .tipo-btn.ingreso { background: var(--verde); }
    .tipo-btn.egreso  { background: var(--naranja); }
    .tipo-btn-icon { font-size: 26px; }

    /* ── BTN VOLVER ── */
    .btn-volver {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--texto-2);
      font-size: 14px;
      cursor: pointer;
      padding: 4px 0;
      -webkit-appearance: none;
    }
    .btn-volver:active { color: var(--azul); }

    /* ── CONFIRMACIÓN ── */
    .confirm-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 8px;
    }
    .confirm-icon.ingreso  { background: #D4F0E3; }
    .confirm-icon.egreso   { background: #FFE8D0; }

    .confirm-tipo {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .confirm-tipo.ingreso { color: var(--verde); }
    .confirm-tipo.egreso  { color: var(--naranja); }

    .confirm-nombre {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--texto);
    }
    .confirm-hora {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      color: var(--azul);
      font-variant-numeric: tabular-nums;
      margin: 4px 0;
    }
    .confirm-fecha {
      text-align: center;
      font-size: 13px;
      color: var(--texto-2);
      text-transform: capitalize;
    }

    .progress-bar {
      height: 4px;
      background: var(--borde);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: var(--acento);
      border-radius: 2px;
      width: 0%;
      transition: width linear;
    }

    /* ── SPINNER ── */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--borde);
      border-top-color: var(--azul);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      text-align: center;
      font-size: 14px;
      color: var(--texto-2);
      margin-top: 10px;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: var(--texto-2);
    }
  </style>
</head>
<body>

<header>
  <!-- TODO: pegá acá la línea completa <img src="data:image/png;base64,..."> de tu index.html actual (el logo no cambió, no lo reproduzco a mano para no arriesgar que se corrompa el base64) -->

      <button class="tipo-btn egreso" id="btn-egreso">

  <!-- PANTALLA 5: Confirmación -->
  <div id="screen-confirm" class="screen">

      <div class="confirm-icon" id="confirm-icon"></div>
      <div class="confirm-tipo" id="confirm-tipo"></div>
      <div class="confirm-nombre" id="confirm-nombre"></div>
      <div class="confirm-hora" id="confirm-hora"></div>

  <!-- PANTALLA 6: Error -->
  <div id="screen-error" class="screen">

      <div style="font-size:48px; margin-bottom:12px;">❌</div>
      <div style="font-size:16px; font-weight:700; color:var(--rojo); margin-bottom:8px;">Error al registrar</div>

<footer>Alpac SRL · Sistema de fichada</footer>

<script>
// ══════════════════════════════════════════════════════
// CONFIGURACIÓN — editá esto antes de publicar
// ══════════════════════════════════════════════════════
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRCWTP1T0NXAJqH5TLxcktca52nRsv52D8R6vdeAfTGwAcVL9puHqL4fG7OCkXEeDNdA/exec";

// ── GEOLOCALIZACIÓN ──
const FABRICA_LAT    = -34.68052856844603;
const FABRICA_LNG    = -58.37472894596177;
const RADIO_METROS   = 100; // radio permitido alrededor de la fábrica
const MINUTOS_ENTRE_FICHADAS = 20; // tiempo mínimo entre fichadas desde el mismo dispositivo

const EMPLEADOS = [
  { nombre: "Jose Luis Vazquez",  pin: "06" },
  { nombre: "Jesus Giles",        pin: "09" },
  { nombre: "Barbara Perez",      pin: "04" },
  { nombre: "Franco Bustos",      pin: "50" },
  { nombre: "Gastón Bustos",      pin: "51" },
  { nombre: "Claudio Díaz",       pin: "08" },
  { nombre: "Paola Perez",        pin: "10" },
  { nombre: "Carlos Gauto",       pin: "26" },
  { nombre: "Naim Soria",         pin: "55" },
  { nombre: "Julián Torres",      pin: "56" },
  { nombre: "Leandra Torres",     pin: "22" },
  { nombre: "Roberto Bustos",     pin: "07" },
  { nombre: "Alejandro Fava",     pin: "05" },
  { nombre: "Melina Fava",        pin: "20" },
  { nombre: "Matías Ochoa",       pin: "24" },
  { nombre: "Julio Bustos",       pin: "02" },
  { nombre: "Diego Medina",       pin: "03" },
  { nombre: "Sergio Ochoa",       pin: "01" },
  { nombre: "Gabriel Bustos",     pin: "32" },
  { nombre: "Ciro Palavecino",    pin: "53" },
  { nombre: "Santiago Polo",      pin: "31" },
  { nombre: "Gabi Perez",         pin: "30" },
  { nombre: "Marcos Perez",       pin: "54" },
];
// ══════════════════════════════════════════════════════

// --- Reloj ---
function actualizarReloj() {
  const now = new Date();
  document.getElementById("hora-display").textContent =
    now.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  document.getElementById("fecha-display").textContent =
    now.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
}
actualizarReloj();
setInterval(actualizarReloj, 1000);

// --- Estado ---
let empleadoSeleccionado = null;
let pinIngresado = "";
let procesandoCola = false;

// --- Pantallas ---
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function goToEmpleados() {
  pinIngresado = "";
  empleadoSeleccionado = null;
  document.getElementById("buscar").value = "";
  renderLista(EMPLEADOS);
  showScreen("screen-empleado");
}

// ── GEOLOCALIZACIÓN ──────────────────────────────────────────
// Se pide apenas se abre la página (en paralelo mientras buscan su nombre),
// así cuando eligen quién son ya está resuelta casi siempre.

let ubicacionPromise = null;

function crearPromesaUbicacion() {
  ubicacionPromise = new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject({ code: 0 }); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true, timeout: 10000, maximumAge: 30000
    });
  });
  return ubicacionPromise;
}
crearPromesaUbicacion();

function calcularDistancia(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function verificarUbicacion(onSuccess) {
  const promesa = ubicacionPromise || crearPromesaUbicacion();

  showScreen("screen-loading");
  document.querySelector(".loading-text").textContent = "Verificando ubicación...";

  promesa.then(pos => {
    const dist = calcularDistancia(
      pos.coords.latitude, pos.coords.longitude,
      FABRICA_LAT, FABRICA_LNG
    );
    if (dist <= RADIO_METROS) {
      document.getElementById("wifi-error").classList.remove("visible");
      onSuccess();
    } else {
      mostrarErrorGeo("Estás a " + Math.round(dist) + " metros de la fábrica. Tenés que estar dentro para fichar.");
    }
  }).catch(err => {
    ubicacionPromise = null; // para que el próximo intento pida ubicación de nuevo
    if (err.code === 1) {
      mostrarErrorGeo("Permiso de ubicación denegado. Activá la ubicación en tu celular para poder fichar.");
    } else if (err.code === 0) {
      mostrarErrorGeo("Tu navegador no soporta geolocalización.");
    } else {
      mostrarErrorGeo("No se pudo obtener tu ubicación. Intentá de nuevo.");
    }
  });
}

function mostrarErrorGeo(msg) {
  const banner = document.getElementById("wifi-error");
  banner.innerHTML = "📍 " + msg;
  banner.classList.add("visible");
  showScreen("screen-empleado");
}

// --- Lista de empleados ---
function iniciales(nombre) {
  const p = nombre.trim().split(" ");
  return (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase();
}
function renderLista(lista) {
  const cont = document.getElementById("lista-empleados");
  cont.innerHTML = "";
  lista.forEach(emp => {
    const btn = document.createElement("button");
    btn.className = "empleado-btn";
    btn.innerHTML = `
      <div class="empleado-avatar">${iniciales(emp.nombre)}</div>
      <div class="empleado-nombre">${emp.nombre}</div>
      <div class="empleado-arrow">›</div>
    `;
    btn.onclick = () => seleccionarEmpleado(emp);
    cont.appendChild(btn);
  });
}
document.getElementById("buscar").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  renderLista(EMPLEADOS.filter(emp => emp.nombre.toLowerCase().includes(q)));
});
renderLista(EMPLEADOS);

// --- Selección de empleado ---
function seleccionarEmpleado(emp) {
  verificarUbicacion(() => {
    empleadoSeleccionado = emp;
    pinIngresado = "";
    document.getElementById("pin-avatar").textContent = iniciales(emp.nombre);
    document.getElementById("pin-nombre").textContent = emp.nombre;
    limpiarPin();
    showScreen("screen-pin");
    document.getElementById("pin-error").textContent = "";
  });
}
document.getElementById("btn-volver").onclick = goToEmpleados;
document.getElementById("btn-volver-tipo").onclick = goToEmpleados;

// --- Teclado numérico ---
const teclas = ["1","2","3","4","5","6","7","8","9","limpiar","0","borrar"];
const subLabels = { "2":"ABC","3":"DEF","4":"GHI","5":"JKL","6":"MNO","7":"PQRS","8":"TUV","9":"WXYZ" };
const numpad = document.getElementById("numpad");
teclas.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "num-btn" + (t === "limpiar" ? " clear" : t === "borrar" ? " borrar" : "");
  if (t === "limpiar") btn.textContent = "✕";
  else if (t === "borrar") btn.textContent = "⌫";
  else {
    btn.innerHTML = t + (subLabels[t] ? `<span class="sub">${subLabels[t]}</span>` : "");
  }
  btn.onclick = () => presionarTecla(t);
  numpad.appendChild(btn);
});

function presionarTecla(t) {
  if (t === "limpiar") { pinIngresado = ""; }
  else if (t === "borrar") { pinIngresado = pinIngresado.slice(0, -1); }
  else if (pinIngresado.length < 2) { pinIngresado += t; }
  actualizarDots();
  if (pinIngresado.length === 2) verificarPin();
}

function actualizarDots() {
  for (let i = 0; i < 2; i++) {
    const d = document.getElementById("d" + i);
    d.classList.toggle("filled", i < pinIngresado.length);
    d.classList.remove("error");
  }
}
function limpiarPin() {
  pinIngresado = "";
  actualizarDots();
}

// ── COOLDOWN ENTRE FICHADAS (persiste entre recargas de página) ──

function obtenerUltimaFichadaLocal(nombre) {
  try {
    const todos = JSON.parse(localStorage.getItem('fichada_ultima_local') || '{}');
    return todos[nombre] || null; // { fecha, hora }
  } catch (e) { return null; }
}
function guardarUltimaFichadaLocal(nombre, fecha, hora) {
  try {
    const todos = JSON.parse(localStorage.getItem('fichada_ultima_local') || '{}');
    todos[nombre] = { fecha, hora };
    localStorage.setItem('fichada_ultima_local', JSON.stringify(todos));
  } catch (e) {}
}
function minutosDesdeUltimaFichada(nombre) {
  const estado = obtenerUltimaFichadaLocal(nombre);
  if (!estado || !estado.hora) return null;
  const fechaHoy = new Date().toLocaleDateString("es-AR");
  if (estado.fecha !== fechaHoy) return null;
  const partes = estado.hora.split(":").map(Number);
  const ultima = new Date();
  ultima.setHours(partes[0], partes[1], partes[2] || 0, 0);
  return (Date.now() - ultima.getTime()) / 1000 / 60;
}

// --- Verificación PIN ---
function verificarPin() {
  if (pinIngresado === empleadoSeleccionado.pin) {
    const minutosTranscurridos = minutosDesdeUltimaFichada(empleadoSeleccionado.nombre);
    if (minutosTranscurridos !== null && minutosTranscurridos < MINUTOS_ENTRE_FICHADAS) {
      const minutosRestantes = Math.ceil(MINUTOS_ENTRE_FICHADAS - minutosTranscurridos);
      document.getElementById("pin-error").textContent =
        "Esperá " + minutosRestantes + " min antes de volver a fichar.";
      setTimeout(() => {
        limpiarPin();
        document.getElementById("pin-error").textContent = "";
        goToEmpleados();
      }, 2500);
      return;
    }
    mostrarPantallaTipo();
  } else {
    for (let i = 0; i < 2; i++) {
      const d = document.getElementById("d" + i);
      d.classList.add("error");
      d.classList.remove("filled");
    }
    document.getElementById("pin-error").textContent = "PIN incorrecto. Intentá de nuevo.";
    setTimeout(() => {
      limpiarPin();
      document.getElementById("pin-error").textContent = "";
    }, 1200);
  }
}

// --- Pantalla Ingreso/Egreso ---
function mostrarPantallaTipo() {
  document.getElementById("tipo-avatar").textContent = iniciales(empleadoSeleccionado.nombre);
  document.getElementById("tipo-nombre").textContent = empleadoSeleccionado.nombre;
  showScreen("screen-tipo");
}
document.getElementById("btn-ingreso").onclick = () => registrarFichadaOffline("Entrada");
document.getElementById("btn-egreso").onclick  = () => registrarFichadaOffline("Salida");

// ── COLA OFFLINE ──────────────────────────────────────────────
// El tipo lo eligió la persona, así que acá no hay que predecir nada:
// se guarda tal cual y se muestra la confirmación al instante.

function generarId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
}
function leerCola() {
  try { return JSON.parse(localStorage.getItem('fichada_cola') || '[]'); }
  catch (e) { return []; }
}
function guardarCola(cola) {
  try { localStorage.setItem('fichada_cola', JSON.stringify(cola)); } catch (e) {}
}
function actualizarBadgePendientes() {
  const n = leerCola().length;
  const el = document.getElementById("pendientes-badge");
  if (!el) return;
  el.textContent = n > 0 ? ("⏳ " + n + " pendiente" + (n > 1 ? "s" : "")) : "";
}

function registrarFichadaOffline(tipoElegido) {
  const ahora = new Date();
  const id = generarId();
  const fecha = ahora.toLocaleDateString("es-AR");
  const horaTexto = ahora.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  guardarUltimaFichadaLocal(empleadoSeleccionado.nombre, fecha, horaTexto);

  const payload = {
    id: id,
    nombre: empleadoSeleccionado.nombre,
    tipo: tipoElegido, // "Entrada" | "Salida"
    timestampCliente: ahora.toISOString(),
  };

  const cola = leerCola();
  cola.push(payload);
  guardarCola(cola);
  actualizarBadgePendientes();

  mostrarConfirmacion({ nombre: empleadoSeleccionado.nombre, tipo: tipoElegido });

  procesarCola();
}

async function procesarCola() {
  if (procesandoCola) return;
  procesandoCola = true;

  let cola = leerCola();
  while (cola.length > 0) {
    const item = cola[0];
    try {
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(item),
      });
      const data = await resp.json();
      if (data.status === "ok") {
        cola.shift();
        guardarCola(cola);
        actualizarBadgePendientes();
      } else {
        break; // error del servidor, se reintenta más tarde
      }
    } catch (e) {
      break; // sin conexión, se reintenta más tarde
    }
  }

  procesandoCola = false;
}

window.addEventListener('online', procesarCola);
window.addEventListener('load', procesarCola);
setInterval(procesarCola, 20000);
actualizarBadgePendientes();

// --- Confirmación ---
const TIPOS = {
  "Entrada": { emoji: "🟢", clase: "ingreso", label: "Ingreso registrado" },
  "Salida":  { emoji: "🟠", clase: "egreso",  label: "Egreso registrado"  },
};

function mostrarConfirmacion(data) {
  const tipo  = TIPOS[data.tipo] || { emoji: "✅", clase: "ingreso", label: data.tipo };
  const ahora = new Date();

  document.getElementById("confirm-icon").textContent = tipo.emoji;
  document.getElementById("confirm-icon").className   = `confirm-icon ${tipo.clase}`;
  document.getElementById("confirm-tipo").textContent = tipo.label;
  document.getElementById("confirm-tipo").className   = `confirm-tipo ${tipo.clase}`;
  document.getElementById("confirm-nombre").textContent = data.nombre || empleadoSeleccionado.nombre;
  document.getElementById("confirm-hora").textContent   =
    ahora.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("confirm-fecha").textContent  =
    ahora.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });

  showScreen("screen-confirm");

  const bar = document.getElementById("progress");
  bar.style.transition = "none";
  bar.style.width = "0%";
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      bar.style.transition = "width 2.5s linear";
      bar.style.width = "100%";
    });
  });
  setTimeout(goToEmpleados, 2500);
}

function mostrarError(msg) {
  document.getElementById("error-msg").textContent = msg;
  showScreen("screen-error");
}
</script>
